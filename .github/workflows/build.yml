name: Build TR Naja EXE + DMG
on:
  workflow_dispatch: {}
jobs:
  build-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copier le logiciel
        shell: bash
        run: mkdir -p app && cp ../index.html app/index.html
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with: { name: TR-Naja-EXE-Windows, path: desktop/dist/*.exe, if-no-files-found: error }
  build-mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copier le logiciel
        run: mkdir -p app && cp ../index.html app/index.html
      - run: npm install
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with: { name: TR-Naja-DMG-Mac, path: desktop/dist/*.dmg, if-no-files-found: error }
