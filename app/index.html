<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TR Naja — Gestion</title>
<!-- Bibliothèque optionnelle pour lire/écrire de vrais fichiers .xlsx (nécessite une connexion internet une seule fois).
     Si absente ou hors-ligne, le logiciel bascule automatiquement sur l'import/export CSV (compatible Excel, fonctionne sans internet). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer onerror="window.__XLSX_FAILED__=true"></script>
<style>
:root{
  --green-950:#062b1c;
  --green-900:#0a3d27;
  --green-800:#0f5233;
  --green-700:#15693f;
  --green-600:#1c8a52;
  --green-500:#25a862;
  --green-400:#4fc47f;
  --green-100:#e6f7ec;
  --green-50:#f3fbf6;
  --gold:#c9a227;
  --gold-light:#e8c765;
  --ink:#132318;
  --ink-soft:#4a5a51;
  --paper:#ffffff;
  --line:#dfeee5;
  --red:#c0392b;
  --orange:#d98a1f;
  --shadow: 0 8px 24px -8px rgba(6,43,28,.18);
  --radius:14px;
  --sidebar-w:248px;
  font-size:15px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--green-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--green-400);color:#fff;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c3ded0;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--green-500);}

/* =====================================================
   LOGIN SCREEN
===================================================== */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,.08), transparent 45%),
    linear-gradient(155deg, var(--green-950), var(--green-800) 55%, var(--green-600));
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:var(--paper);
  border-radius:20px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45);
  overflow:hidden;
}
.login-head{
  padding:32px 32px 20px;
  text-align:center;
  background:linear-gradient(160deg,var(--green-800),var(--green-600));
  color:#fff;
  position:relative;
}
.login-head .brand-mark{
  width:76px;height:76px;border-radius:18px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  overflow:hidden;
  box-shadow:0 10px 20px -6px rgba(0,0,0,.35);
}
.login-head .brand-mark img{width:100%;height:100%;object-fit:cover;}
.login-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px;}
.login-head p{margin:6px 0 0;font-size:13px;opacity:.85;}
.login-body{padding:28px 32px 32px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-size:14.5px;background:var(--green-50);color:var(--ink);
  transition:border-color .15s, background .15s;
}
.field input:focus, .field select:focus{
  outline:none;border-color:var(--green-500);background:#fff;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;
  transition:transform .1s ease, box-shadow .15s ease, background .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(160deg,var(--green-600),var(--green-700));color:#fff;box-shadow:0 8px 16px -6px rgba(21,105,63,.5);}
.btn-primary:hover{background:linear-gradient(160deg,var(--green-500),var(--green-600));}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--green-700);border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--green-100);}
.btn-gold{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:var(--green-950);}
.btn-danger{background:#fdeceb;color:var(--red);}
.btn-danger:hover{background:#fbdbd8;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-icon{padding:8px;border-radius:9px;background:var(--green-100);color:var(--green-700);}
.btn-icon:hover{background:var(--green-400);color:#fff;}
.login-error{
  background:#fdeceb;color:var(--red);border:1px solid #f5c6c1;
  padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;display:none;
}
.login-foot{text-align:center;margin-top:14px;font-size:12px;color:var(--ink-soft);}
.demo-users{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);}
.demo-users b{color:var(--green-700);}

/* =====================================================
   APP SHELL
===================================================== */
#appShell{display:none;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  background:linear-gradient(185deg,var(--green-950),var(--green-800) 70%);
  color:#eafdf2;
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:40;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-brand .mark{
  width:42px;height:42px;border-radius:11px;background:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
}
.sidebar-brand .mark img{width:100%;height:100%;object-fit:cover;}
.sidebar-brand .txt div:first-child{font-weight:700;font-size:15px;letter-spacing:.3px;}
.sidebar-brand .txt div:last-child{font-size:10.5px;opacity:.65;text-transform:uppercase;letter-spacing:.8px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;opacity:.45;padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:#d9f3e4;text-decoration:none;font-size:13.8px;font-weight:500;margin-bottom:2px;
  cursor:pointer;transition:background .12s, color .12s;position:relative;
}
.nav-item .ico{width:19px;text-align:center;flex-shrink:0;font-size:15px;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:linear-gradient(160deg,var(--green-500),var(--green-600));color:#fff;box-shadow:0 4px 10px -3px rgba(0,0,0,.3);}
.nav-badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:20px;
}
.sidebar-user{
  padding:14px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
}
.sidebar-user .av{
  width:34px;height:34px;border-radius:50%;background:var(--green-500);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.sidebar-user .who{flex:1;min-width:0;}
.sidebar-user .who div:first-child{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user .who div:last-child{font-size:11px;opacity:.6;}
.sidebar-user .logout-btn{background:transparent;border:none;color:#d9f3e4;font-size:16px;opacity:.7;padding:6px;border-radius:8px;}
.sidebar-user .logout-btn:hover{opacity:1;background:rgba(255,255,255,.1);}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:30;
}
.topbar h2{margin:0;font-size:19px;font-weight:700;color:var(--green-900);}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);}
.topbar .spacer{flex:1;}
.cash-pill{
  display:flex;align-items:center;gap:7px;background:var(--green-100);color:var(--green-800);
  padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
}
.cash-pill.closed{background:#fdeceb;color:var(--red);}
.cash-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green-500);}
.cash-pill.closed .dot{background:var(--red);}
.content{padding:24px 26px 60px;flex:1;}

/* =====================================================
   SHARED UI COMPONENTS
===================================================== */
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--paper);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;border:1px solid var(--line);
}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.card-head h3{margin:0;font-size:15.5px;font-weight:700;color:var(--green-900);}
.card-head .spacer{flex:1;}

.kpi{
  background:var(--paper);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.kpi .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.kpi .val{font-size:24px;font-weight:800;color:var(--green-900);}
.kpi .icon-bg{position:absolute;right:14px;top:14px;font-size:26px;opacity:.18;}
.kpi.alert .val{color:var(--red);}
.kpi.warn .val{color:var(--orange);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;padding:10px 12px;background:var(--green-50);color:var(--green-800);
  font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;
  border-bottom:2px solid var(--line);position:sticky;top:0;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle;}
tr:hover td{background:var(--green-50);}
.table-wrap{overflow-x:auto;border-radius:10px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-green{background:var(--green-100);color:var(--green-700);}
.badge-orange{background:#fdf1de;color:var(--orange);}
.badge-red{background:#fdeceb;color:var(--red);}
.badge-gray{background:#eef1ef;color:#5a6a61;}
.badge-gold{background:#faf3dc;color:#9a7b0f;}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .spacer{flex:1;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--green-50);border:1.5px solid var(--line);
  border-radius:10px;padding:8px 12px;min-width:220px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13.5px;width:100%;color:var(--ink);}
select.filter, input.filter{
  padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink);
}

.tag-select{display:flex;gap:8px;flex-wrap:wrap;}
.tag-opt{
  padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);
}
.tag-opt.active{background:var(--green-600);border-color:var(--green-600);color:#fff;}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(6,30,20,.55);z-index:100;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:620px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
  margin:auto;
}
.modal.modal-lg{max-width:900px;}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);gap:12px;}
.modal-head h3{margin:0;font-size:16.5px;color:var(--green-900);font-weight:700;}
.modal-head .spacer{flex:1;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px 8px;border-radius:8px;}
.modal-close:hover{background:var(--green-100);}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

.pill-row{display:flex;gap:8px;background:var(--green-50);padding:4px;border-radius:11px;width:fit-content;}
.pill-row button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}
.pill-row button.active{background:#fff;color:var(--green-700);box-shadow:0 2px 6px rgba(0,0,0,.08);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .em-ico{font-size:38px;margin-bottom:10px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--green-800);color:#fff;padding:13px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 25px -8px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;min-width:240px;
  animation:toastIn .25s ease;
}
.toast.err{background:var(--red);}
.toast.warn{background:var(--orange);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0;}

.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
.perm-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--green-50);font-size:13px;}
.perm-row input{width:16px;height:16px;accent-color:var(--green-600);}

.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-tg{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:22px;transition:.2s;}
.slider-tg:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
input:checked + .slider-tg{background:var(--green-600);}
input:checked + .slider-tg:before{transform:translateX(18px);}

/* POS layout */
.pos-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
@media(max-width:1100px){.pos-wrap{grid-template-columns:1fr;}}
.pos-products{max-height:calc(100vh - 220px);overflow-y:auto;}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.prod-card{
  border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;
  cursor:pointer;transition:border-color .12s, transform .1s;
}
.prod-card:hover{border-color:var(--green-500);transform:translateY(-2px);}
.prod-card .pname{font-weight:700;font-size:13px;color:var(--green-900);margin-bottom:4px;line-height:1.25;}
.prod-card .pmeta{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.prod-card .pstock{font-size:11px;font-weight:700;}
.cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
.cart-item .ci-name{flex:1;min-width:0;}
.cart-item .ci-name div:first-child{font-weight:600;font-size:13px;}
.cart-item .ci-name div:last-child{font-size:11px;color:var(--ink-soft);}
.qty-ctl{display:flex;align-items:center;gap:6px;}
.qty-ctl button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700;}
.qty-ctl input{width:40px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:13px;}
.cart-total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
.cart-total-row.grand{font-size:18px;font-weight:800;color:var(--green-800);border-top:2px solid var(--green-100);margin-top:8px;padding-top:12px;}

.tabs-h{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tab-h{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab-h.active{color:var(--green-700);border-color:var(--green-600);}

.receipt{font-family:'Courier New',monospace;font-size:12px;width:280px;margin:0 auto;color:#000;}
.receipt hr{border:none;border-top:1px dashed #000;}
.receipt .center{text-align:center;}
.receipt table{font-size:11px;}
.receipt td, .receipt th{padding:2px 0;border:none;}

.pdf-doc{font-family:Arial,Helvetica,sans-serif;color:#111;max-width:900px;margin:0 auto;padding:10px;}
.pdf-doc .pdf-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0f5233;padding-bottom:12px;margin-bottom:16px;}
.pdf-doc .pdf-head img{width:56px;height:56px;object-fit:cover;border-radius:8px;}
.pdf-doc .pdf-head h1{font-size:19px;margin:0;color:#0f5233;}
.pdf-doc .pdf-head .pdf-sub{font-size:12px;color:#555;}
.pdf-doc .pdf-meta{font-size:11.5px;color:#555;margin-bottom:14px;}
.pdf-doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:16px;}
.pdf-doc th{background:#e6f7ec;color:#0f5233;text-align:left;padding:6px 8px;border:1px solid #c9e6d5;}
.pdf-doc td{padding:6px 8px;border:1px solid #dfeee5;}
.pdf-doc h2{font-size:14px;color:#0f5233;margin:18px 0 8px;}
.pdf-doc .pdf-foot{margin-top:20px;font-size:10.5px;color:#888;text-align:center;}

.stock-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.dot-green{background:var(--green-500);}
.dot-orange{background:var(--orange);}
.dot-red{background:var(--red);}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
}
#printArea{display:none;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.small-note{font-size:12px;color:var(--ink-soft);line-height:1.5;}
.link-btn{background:none;border:none;color:var(--green-700);font-weight:600;font-size:13px;text-decoration:underline;padding:0;}

.icon-btn-bell{position:relative;background:var(--green-100);border:none;color:var(--green-800);width:38px;height:38px;border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center;}
.icon-btn-bell:hover{background:var(--green-400);color:#fff;}
.notif-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notif-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.notif-row:last-child{border-bottom:none;}
.notif-row .n-ico{font-size:18px;flex-shrink:0;}
.notif-row .n-txt{flex:1;font-size:13.5px;}
.notif-row .n-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.notif-row.unread .n-txt{font-weight:700;color:var(--green-900);}
.unit-chain-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.unit-chain-row .uc-name{flex:1;min-width:120px;}
.unit-chain-arrow{color:var(--green-500);font-weight:800;font-size:16px;}
.qa-btn{border:1.5px dashed var(--green-400);background:var(--green-50);color:var(--green-700);border-radius:9px;width:40px;flex-shrink:0;font-weight:800;font-size:16px;}
.qa-btn:hover{background:var(--green-500);color:#fff;border-style:solid;}
.select-row{display:flex;gap:6px;align-items:flex-end;}

.card-alert-red{background:#fdeceb;border-color:#f5c6c1;}
.card-alert-red .card-head h3{color:var(--red);}
.card-alert-orange{background:#fdf1de;border-color:#f5dcab;}
.card-alert-orange .card-head h3{color:#9a5b0f;}
.select-row select{flex:1;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-head">
      <div class="brand-mark"><img id="loginLogoImg" alt="TR Naja"></div>
      <h1>TR Naja</h1>
      <p>Vente en gros et en détail — Logiciel de gestion</p>
    </div>
    <div class="login-body">
      <div class="login-error" id="loginError"></div>
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="loginUser" placeholder="ex: admin" autocomplete="username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" onclick="App.login()">Se connecter</button>
      <div class="login-foot">
        <button class="link-btn" onclick="App.showForgot()">Mot de passe oublié ?</button>
        <span style="color:var(--ink-soft);"> · </span>
        <button class="link-btn" onclick="App.showSignup()">Créer un compte</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="appShell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><img id="sidebarLogoImg" alt="TR Naja"></div>
      <div class="txt"><div>TR Naja</div><div>Gestion demi-gros</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-user">
      <div class="av" id="userAvatar">?</div>
      <div class="who">
        <div id="userNameLbl">—</div>
        <div id="userRoleLbl">—</div>
      </div>
      <button class="logout-btn" title="Mon profil" onclick="openMyProfile()">👤</button>
      <button class="logout-btn" title="Déconnexion" onclick="App.logout()">⏻</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Tableau de bord</h2>
        <div class="sub" id="pageSub">—</div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn-bell" title="Notifications" onclick="openNotifications()">🔔<span class="notif-count" id="notifBadge" style="display:none;">0</span></button>
      <div class="cash-pill closed" id="cashPill"><span class="dot"></span><span id="cashPillTxt">Caisse fermée</span></div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

const DB_KEY = 'trnaja_db_v1';
let DB = null;
let CURRENT_TAB = 'dashboard';
let CART = []; // panier de vente en cours

/* ---------- Helpers génériques ---------- */
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateOnly(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('fr-FR'); }
function fmtAr(n){ n = Number(n)||0; return Math.round(n).toLocaleString('fr-FR') + ' Ar'; }
function fmtNum(n){
  n = Number(n)||0;
  n = Math.round(n*10000)/10000; // nettoie les imprécisions flottantes (ex: 0.999999999998 -> 1)
  if(Object.is(n,-0)) n = 0;
  return n.toLocaleString('fr-FR', {maximumFractionDigits:4});
}
function roundQty(n){ n = Math.round((Number(n)||0)*10000)/10000; return Object.is(n,-0)?0:n; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function byId(arr,id){ return (arr||[]).find(x=>x.id===id); }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err'?' err':type==='warn'?' warn':'');
  el.innerHTML = (type==='err'?'⚠️ ':type==='warn'?'⏳ ':'✅ ') + escapeHtml(msg);
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------- Simple hash (démo — pas une sécurité cryptographique) ---------- */
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h) + str.charCodeAt(i); h = h & h; }
  return 'h'+Math.abs(h).toString(36) + '_' + str.length;
}

/* Rétrocompatibilité : ajoute les nouveaux champs à une base existante déjà sauvegardée */
function migrateDB(){
  if(!DB.notifications) DB.notifications = [];
  if(!DB.settings.lastExpiryCheck) DB.settings.lastExpiryCheck = null;
  if(!Array.isArray(DB.credits)) DB.credits = [];
  if(!Array.isArray(DB.expenses)) DB.expenses = [];
  if(!Array.isArray(DB.suppliers)) DB.suppliers = [];
  if(!Array.isArray(DB.sales)) DB.sales = [];
  if(!Array.isArray(DB.stockMovements)) DB.stockMovements = [];
  if(!Array.isArray(DB.history)) DB.history = [];
  if(!Array.isArray(DB.inventories)) DB.inventories = [];
  if(!Array.isArray(DB.products)) DB.products = [];
  if(!Array.isArray(DB.categories)) DB.categories = [];
  if(!Array.isArray(DB.stocks)) DB.stocks = [];
  if(!Array.isArray(DB.cashSessions)) DB.cashSessions = [];
  if(!DB.stockLevels) DB.stockLevels = {};
  (DB.stocks||[]).forEach(s=>{ if(s.address===undefined) s.address=''; if(s.active===undefined) s.active=true; });
  (DB.credits||[]).forEach(cr=>{ if(!Array.isArray(cr.payments)) cr.payments = []; if(cr.remaining===undefined) cr.remaining = (cr.total||0)-(cr.paid||0); });
  (DB.users||[]).forEach(u=>{ if(u.email===undefined) u.email=''; if(!u.permissions) u.permissions={}; });
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ DB = JSON.parse(raw); migrateDB(); }
    else { DB = seedDB(); saveDB(); }
  }catch(e){
    console.error('Erreur de lecture des données, réinitialisation.', e);
    DB = seedDB(); saveDB();
  }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}
function logHistory(action, details){
  DB.history.unshift({ id: uid('h'), date: nowISO(), userId: SESSION.user? SESSION.user.id:null, userName: SESSION.user? SESSION.user.fullName||SESSION.user.username : 'Système', action, details: details||'' });
  if(DB.history.length > 3000) DB.history.length = 3000;
}

function salesBetween(startDate, endDate){
  return DB.sales.filter(s=> s.status==='valid' && s.date>=startDate && s.date<=endDate);
}
function dayRange(offsetDays){
  const d = new Date(); d.setDate(d.getDate()-offsetDays);
  const s = d.toISOString().slice(0,10)+'T00:00:00.000Z';
  const e = d.toISOString().slice(0,10)+'T23:59:59.999Z';
  return [s,e,d];
}
function sumSales(list){ return list.reduce((a,s)=>a+s.total,0); }
function estimateProfit(sale){
  let p = 0;
  sale.items.forEach(it=>{
    const prod = byId(DB.products, it.productId);
    if(prod){ p += (it.unitPrice - (prod.purchasePrice/ (it.unitQtyInBase||1))) * it.qty; }
  });
  return p;
}
function lowStockProducts(){
  return DB.products.filter(p=>p.active!==false).filter(p=>{
    return totalStock(p.id) <= (p.minThresholdBase||0);
  });
}
function expiringProducts(days){
  const lim = new Date(); lim.setDate(lim.getDate()+ (days||30));
  return DB.products.filter(p=>p.active!==false && p.expiryDate).filter(p=> new Date(p.expiryDate) <= lim);
}
function totalStock(productId){
  const levels = DB.stockLevels[productId] || {};
  return Object.values(levels).reduce((a,b)=>a+b,0);
}

let PROD_FILTER = { q:'', cat:'', stock:'' };

function stockStatus(p){
  const tot = totalStock(p.id);
  const min = p.minThresholdBase||0;
  if(tot<=0) return 'red';
  if(tot<=min) return 'orange';
  return 'green';
}

function render_products(c){
  const cats = DB.categories;
  c.innerHTML = `

      </select>
      <select class="filter" id="prodStockFilter">
        <option value="">Tous les stocks</option>

      </select>

      </table></div>
    </div>
  `;
  document.getElementById('prodSearch').addEventListener('input', e=>{ PROD_FILTER.q=e.target.value; renderProdTable(); });
  document.getElementById('prodCatFilter').addEventListener('change', e=>{ PROD_FILTER.cat=e.target.value; renderProdTable(); });
  document.getElementById('prodStockFilter').addEventListener('change', e=>{ PROD_FILTER.stock=e.target.value; renderProdTable(); });
  renderProdTable();

function renderProdTable(){
  const tbody = document.getElementById('prodTbody');
  if(!tbody) return;
  let list = DB.products.filter(p=>p.active!==false);
  if(PROD_FILTER.q){
    const q = PROD_FILTER.q.toLowerCase();
    list = list.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q));
  }
  if(PROD_FILTER.cat) list = list.filter(p=>p.categoryId===PROD_FILTER.cat);
  if(PROD_FILTER.stock) list = list.filter(p=> (DB.stockLevels[p.id]||{})[PROD_FILTER.stock] > 0 || p.homeStockId===PROD_FILTER.stock);

  if(!list.length){ tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="em-ico">📦</div>Aucun produit trouvé.</div></td></tr>`; return; }

  tbody.innerHTML = list.map(p=>{
    const cat = byId(DB.categories, p.categoryId);
    const tot = totalStock(p.id);
    const st = stockStatus(p);
    const mainUnit = p.units[0];
    const dotClass = st==='green'?'dot-green':st==='orange'?'dot-orange':'dot-red';
    let expTxt = '—', expBadge='';
    if(p.expiryDate){
      const days = Math.ceil((new Date(p.expiryDate) - new Date())/86400000);
      expTxt = fmtDateOnly(p.expiryDate);
      if(days<0) expBadge = '<span class="badge badge-red">Périmé</span>';
      else if(days<=(DB.settings.expiryWarnDays||30)) expBadge = `<span class="badge badge-orange">${days} j</span>`;
    }
    return `<tr>
      <td><b>${escapeHtml(p.name)}</b><br><span class="small-note">${escapeHtml(p.code||'')}</span></td>
      <td>${escapeHtml(cat?cat.name:'—')}</td>
      <td><span class="stock-dot ${dotClass}"></span>${fmtNum(tot)} ${escapeHtml(mainUnit?mainUnit.name:'')}</td>
      <td>${fmtNum(p.minThresholdBase||0)}</td>
      <td>${mainUnit? fmtAr(mainUnit.priceRetail||mainUnit.priceWholesale||0) : '—'}</td>
      <td>${expTxt} ${expBadge}</td>
      <td>${st==='red'?'<span class="badge badge-red">Rupture</span>': st==='orange'?'<span class="badge badge-orange">Stock faible</span>':'<span class="badge badge-green">OK</span>'}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-icon btn-sm" title="Modifier" onclick="openProductModal('${p.id}')">✏️</button>
        <button class="btn btn-icon btn-sm" title="Désactiver" onclick="deactivateProduct('${p.id}')">🗑️</button>
        ${isAdmin()? `<button class="btn btn-icon btn-sm" title="Supprimer définitivement" onclick="deleteProductPermanently('${p.id}')">❌</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

function deactivateProduct(id){
  const p = byId(DB.products, id);
  confirmAction(`Désactiver le produit "${p.name}" ? Il ne sera plus visible en vente mais son historique reste conservé.`, ()=>{
    p.active = false;
    logHistory('Produit désactivé', p.name);
    saveDB(); renderProdTable(); toast('Produit désactivé.');
  }, 'Désactiver', true);
}
function deleteProductPermanently(id){
  const p = byId(DB.products, id);
  const hasSales = DB.sales.some(s=>s.items.some(it=>it.productId===id));
  const warn = hasSales ? " Attention : ce produit apparaît déjà dans des ventes enregistrées — l'historique des ventes gardera son nom mais le produit ne sera plus retrouvable dans les fiches. Il est généralement plus sûr de le désactiver." : '';
  confirmAction(`Supprimer DÉFINITIVEMENT le produit "${p.name}" ? Cette action est irréversible.${warn}`, ()=>{
    DB.products = DB.products.filter(x=>x.id!==id);
    delete DB.stockLevels[id];
    logHistory('Produit supprimé définitivement', p.name);
    saveDB(); refresh(); toast('Produit supprimé définitivement.');
  }, 'Supprimer définitivement', true);
}

/* ---------- Chaîne d'unités courante (lue depuis le formulaire, pour la quantité/prix d'achat) ---------- */
function computeQtyInBaseChain(){
  const rows = Array.from(document.querySelectorAll('#unitsWrap .unit-row'));
  const n = rows.length;
  if(!n) return [];
  const ratios = rows.map(r=> parseFloat(r.querySelector('.u-ratio').value) || null);
  const qtyInBase = new Array(n);
  qtyInBase[n-1] = 1;
  for(let i=n-2;i>=0;i--){ qtyInBase[i] = (ratios[i]||1) * qtyInBase[i+1]; }
  return rows.map((r,i)=>({ name: r.querySelector('.u-name').value.trim()||'Unité', qtyInBase: qtyInBase[i] }));
}
function refreshPurchaseUnitOptions(){
  const sel = document.getElementById('pdPurchaseUnit');
  if(!sel) return;
  const chain = computeQtyInBaseChain();
  if(!chain.length) return;
  const prevIdx = sel.dataset.prevIdx!=null ? parseInt(sel.dataset.prevIdx) : sel.selectedIndex;
  sel.innerHTML = chain.map((u,i)=>`<option value="${i}">${escapeHtml(u.name)}</option>`).join('');
  sel.selectedIndex = Math.min(Math.max(prevIdx,0), chain.length-1);
  sel.dataset.prevIdx = sel.selectedIndex;
}
function onPurchaseUnitChange(){
  const sel = document.getElementById('pdPurchaseUnit');
  const priceEl = document.getElementById('pdPurchasePriceUnit');
  const chain = computeQtyInBaseChain();
  const prevIdx = parseInt(sel.dataset.prevIdx||sel.selectedIndex);
  const newIdx = sel.selectedIndex;
  const oldUnit = chain[prevIdx], newUnit = chain[newIdx];
  const curVal = parseFloat(priceEl.value);
  if(oldUnit && newUnit && !isNaN(curVal) && oldUnit.qtyInBase>0){
    const pricePerBase = curVal / oldUnit.qtyInBase;
    priceEl.value = Math.round(pricePerBase * newUnit.qtyInBase);
  }
  sel.dataset.prevIdx = newIdx;
}

function saveProduct(id){
  const name = document.getElementById('pdName').value.trim();
  if(!name){ toast('Le nom du produit est obligatoire.', 'err'); return; }
  const unitRows = Array.from(document.querySelectorAll('#unitsWrap .unit-row'));
  if(!unitRows.length){ toast('Ajoutez au moins une unité.', 'err'); return; }
  // Lecture de la chaîne de conversion (de la plus grande à la plus petite unité)
  const rawChain = unitRows.map(r=>({
    id: r.dataset.uid,
    name: r.querySelector('.u-name').value.trim() || 'Unité',
    ratio: parseFloat(r.querySelector('.u-ratio') ? r.querySelector('.u-ratio').value : '') || null,
    priceWholesale: parseFloat(r.querySelector('.u-pgros').value)||0,
    priceRetail: parseFloat(r.querySelector('.u-pdetail').value)||0,
    priceWithBottle: parseFloat(r.querySelector('.u-pbottle').value)||0,
    priceWithoutBottle: parseFloat(r.querySelector('.u-pnobottle').value)||0,
  }));
  // Vérifie que chaque unité (sauf la dernière) a bien un ratio renseigné
  for(let i=0;i<rawChain.length-1;i++){
    if(!rawChain[i].ratio || rawChain[i].ratio<=0){
      toast(`Indiquez la conversion pour l'unité "${rawChain[i].name}" (ex: combien de "${rawChain[i+1].name}" dans 1 "${rawChain[i].name}").`, 'err');
      return;
    }
  }
  // Calcule qtyInBase en partant de la dernière unité (base = 1) en remontant
  const n = rawChain.length;
  const qtyInBaseArr = new Array(n);
  qtyInBaseArr[n-1] = 1;
  for(let i=n-2;i>=0;i--){ qtyInBaseArr[i] = rawChain[i].ratio * qtyInBaseArr[i+1]; }
  const chainWithBase = rawChain.map((u,i)=>({ name:u.name, qtyInBase: qtyInBaseArr[i] }));
  const units = rawChain.map((u,i)=>({
    id: u.id, name: u.name, qtyInBase: qtyInBaseArr[i],
    priceWholesale: u.priceWholesale, priceRetail: u.priceRetail,
    priceWithBottle: u.priceWithBottle, priceWithoutBottle: u.priceWithoutBottle,
  })).sort((a,b)=>a.qtyInBase-b.qtyInBase); // on stocke ensuite de la plus petite (base) à la plus grande

  // Prix d'achat : converti depuis l'unité choisie vers le prix "par unité de base"
  const purchaseUnitIdx = parseInt(document.getElementById('pdPurchaseUnit').value)||0;
  const purchaseUnit = chainWithBase[purchaseUnitIdx] || chainWithBase[chainWithBase.length-1];
  const purchasePriceForUnit = parseFloat(document.getElementById('pdPurchasePriceUnit').value)||0;
  const purchasePricePerBase = purchaseUnit.qtyInBase>0 ? purchasePriceForUnit/purchaseUnit.qtyInBase : purchasePriceForUnit;

  const data = {
    name,
    categoryId: document.getElementById('pdCategory').value,
    supplierId: document.getElementById('pdSupplier').value,
    homeStockId: document.getElementById('pdStock').value,
    special: document.getElementById('pdSpecial').value || null,
    purchasePrice: purchasePricePerBase,
    minThresholdBase: parseFloat(document.getElementById('pdMinThreshold').value)||0,
    expiryDate: document.getElementById('pdExpiry').value || null,
    notes: document.getElementById('pdNotes').value.trim(),
    units,
    active: true,
  };

  if(id){
    const p = byId(DB.products,id);
    Object.assign(p, data);
    logHistory('Produit modifié', p.name);
    toast('Produit mis à jour.');
  } else {
    const p = { id: uid('p'), entryDate: nowISO(), code:'', barcode:'', brand:'', location:'', locationNumber:'', ...data };
    DB.products.push(p);
    if(!DB.stockLevels[p.id]) DB.stockLevels[p.id] = {};
    const initQtyEl = document.getElementById('pdInitialQty');
    const initQtyInPurchaseUnit = initQtyEl ? (parseFloat(initQtyEl.value)||0) : 0;
    const initQtyBase = initQtyInPurchaseUnit * (purchaseUnit.qtyInBase||1);
    if(initQtyBase > 0){
      DB.stockLevels[p.id][p.homeStockId] = roundQty(initQtyBase);
      DB.stockMovements.unshift({id:uid('mv'), type:'entry', productId:p.id, productName:p.name, qty:roundQty(initQtyBase), fromStock:null, toStock:p.homeStockId, date:nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note:'Stock initial à la création du produit'});
    }
    addNotification('product', `Nouveau produit créé : ${p.name}`);
    logHistory('Produit créé', p.name);
    toast('Produit créé' + (initQtyBase>0? ' avec stock initial de '+fmtNum(initQtyBase)+'.':'.'));
  }
  saveDB();
  closeModal();
  refresh();
}

function parseCSVText(text){
  // détecte le séparateur (virgule ou point-virgule)
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(line=>{
    // simple CSV split respectant les guillemets
    const cells = [];
    let cur = '', inQ=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch === '"'){ inQ = !inQ; continue; }
      if(ch === sep && !inQ){ cells.push(cur); cur=''; continue; }
      cur += ch;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}

function parseDateFR(s){
  if(!s) return null;
  s = s.trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return s.slice(0,10);
  return null;
}

function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const fb = document.getElementById('importFeedback');
  const name = file.name.toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    if(typeof XLSX === 'undefined'){
      fb.innerHTML = `<div class="login-error" style="display:block;">La lecture directe des fichiers .xlsx nécessite une connexion internet (une seule fois). Aucune connexion détectée. Merci d'enregistrer votre fichier au format <b>CSV</b> depuis Excel (Fichier → Enregistrer sous → CSV), puis réessayez.</div>`;
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
        processImportRows(rows);
      }catch(err){ fb.innerHTML = `<div class="login-error" style="display:block;">Erreur de lecture du fichier Excel : ${escapeHtml(err.message)}</div>`; }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (e)=>{ processImportRows(parseCSVText(e.target.result)); };
    reader.readAsText(file, 'UTF-8');
  }
}

function processImportRows(rows){
  const fb = document.getElementById('importFeedback');
  if(!rows.length){ fb.innerHTML = '<div class="login-error" style="display:block;">Fichier vide.</div>'; return; }
  // ignore header row (assume first row = headers if it contains "Nom" ou "Code")
  let dataRows = rows;
  const headerJoined = (rows[0]||[]).join('|').toLowerCase();
  if(headerJoined.includes('nom') || headerJoined.includes('code')) dataRows = rows.slice(1);

  IMPORT_ROWS = dataRows.filter(r=>r.some(c=>String(c).trim()!=='')).map((r,idx)=>{
    const [code,nom,categorie,fournisseur,stock,emplacement,numEmp,quantite,unite,prixAchat,prixGros,prixDetail,seuil,dateEntree,peremption,obs] = r;
    const errors = [];
    if(!nom || !nom.trim()) errors.push('Nom manquant');
    const qty = parseFloat(String(quantite).replace(/\s/g,'').replace(',','.'));
    if(quantite!==undefined && quantite!=='' && isNaN(qty)) errors.push('Quantité invalide');
    const pa = parseFloat(String(prixAchat).replace(/\s/g,'').replace(',','.'))||0;
    const pg = parseFloat(String(prixGros).replace(/\s/g,'').replace(',','.'))||0;
    const pd = parseFloat(String(prixDetail).replace(/\s/g,'').replace(',','.'))||0;
    return {
      idx, code:(code||'').trim(), name:(nom||'').trim(), categorie:(categorie||'').trim(), fournisseur:(fournisseur||'').trim(),
      stock:(stock||'').trim(), emplacement:(emplacement||'').trim(), numEmp:(numEmp||'').trim(),
      qty: isNaN(qty)?0:qty, unite:(unite||'Pièce').trim(), prixAchat:pa, prixGros:pg, prixDetail:pd,
      seuil: parseFloat(seuil)||0, dateEntree: parseDateFR(dateEntree), peremption: parseDateFR(peremption),
      obs:(obs||'').trim(), errors
    };
  });

  const okCount = IMPORT_ROWS.filter(r=>!r.errors.length).length;
  const errCount = IMPORT_ROWS.length - okCount;
  fb.innerHTML = `<div class="badge badge-green">${okCount} ligne(s) valide(s)</div> ${errCount? `<div class="badge badge-red" style="margin-left:8px;">${errCount} ligne(s) avec erreur</div>`:''}`;

  document.getElementById('importPreviewCard').style.display='block';
  document.getElementById('importOkCount').textContent = okCount + ' valides';
  document.getElementById('importErrCount').textContent = errCount + ' erreurs';
  document.getElementById('importPreviewBody').innerHTML = IMPORT_ROWS.map(r=>`
    <tr style="${r.errors.length? 'background:#fdeceb;':''}">
      <td>${r.idx+1}</td><td>${escapeHtml(r.code)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.categorie)}</td>
      <td>${fmtNum(r.qty)}</td><td>${escapeHtml(r.unite)}</td><td>${fmtAr(r.prixAchat)}</td><td>${fmtAr(r.prixGros)}</td><td>${fmtAr(r.prixDetail)}</td>
      <td>${r.errors.length? `<span class="badge badge-red">${escapeHtml(r.errors.join(', '))}</span>` : '<span class="badge badge-green">OK</span>'}</td>
    </tr>`).join('');
}

function confirmImport(){
  const validRows = IMPORT_ROWS.filter(r=>!r.errors.length);
  if(!validRows.length){ toast('Aucune ligne valide à importer.', 'err'); return; }
  let created=0, updated=0;
  validRows.forEach(r=>{
    let cat = DB.categories.find(c=>c.name.toLowerCase()===r.categorie.toLowerCase());
    if(!cat && r.categorie){ cat = {id:uid('cat'), name:r.categorie}; DB.categories.push(cat); }
    let sup = null;
    if(r.fournisseur){ sup = DB.suppliers.find(s=>s.name.toLowerCase()===r.fournisseur.toLowerCase()); if(!sup){ sup = {id:uid('sup'), name:r.fournisseur}; DB.suppliers.push(sup); } }
    let stock = DB.stocks.find(s=>s.name.toLowerCase()===r.stock.toLowerCase());
    if(!stock){ stock = r.stock? {id:uid('stk'), name:r.stock} : DB.stocks[0]; if(r.stock && !DB.stocks.includes(stock)) DB.stocks.push(stock); }

    let prod = DB.products.find(p=> (r.code && p.code===r.code) || p.name.toLowerCase()===r.name.toLowerCase());
    if(!prod){
      prod = {
        id: uid('p'), code: r.code, barcode:'', name: r.name, categoryId: cat?cat.id:'', supplierId: sup?sup.id:'',
        brand:'', homeStockId: stock.id, location:r.emplacement, locationNumber:r.numEmp, special:null,
        purchasePrice: r.prixAchat, minThresholdBase: r.seuil, expiryDate: r.peremption, notes: r.obs,
        entryDate: r.dateEntree? r.dateEntree+'T00:00:00.000Z' : nowISO(), active:true,
        units: [{id:uid('un'), name:r.unite||'Pièce', qtyInBase:1, priceWholesale:r.prixGros, priceRetail:r.prixDetail, priceWithBottle:0, priceWithoutBottle:0}]
      };
      DB.products.push(prod);
      DB.stockLevels[prod.id] = {};
      created++;
    } else {
      prod.purchasePrice = r.prixAchat || prod.purchasePrice;
      if(r.prixGros) prod.units[0].priceWholesale = r.prixGros;
      if(r.prixDetail) prod.units[0].priceRetail = r.prixDetail;
      if(r.seuil) prod.minThresholdBase = r.seuil;
      if(r.peremption) prod.expiryDate = r.peremption;
      updated++;
    }
    if(r.qty > 0){
      if(!DB.stockLevels[prod.id]) DB.stockLevels[prod.id]={};
      DB.stockLevels[prod.id][stock.id] = roundQty((DB.stockLevels[prod.id][stock.id]||0) + r.qty);
      DB.stockMovements.unshift({id:uid('mv'), type:'import', productId:prod.id, productName:prod.name, qty:r.qty, fromStock:null, toStock:stock.id, date:nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note:'Import Excel/CSV'});
    }
  });
  logHistory('Import de stock', `${created} créés, ${updated} mis à jour`);
  saveDB();
  document.getElementById('importPreviewCard').style.display='none';
  document.getElementById('importFeedback').innerHTML = '';
  document.getElementById('importFile').value = '';
  toast(`Import terminé : ${created} produit(s) créé(s), ${updated} mis à jour.`);
}

    <div class="card" style="position:sticky;top:80px;">
      <div class="card-head"><h3>🧾 Panier</h3><div class="spacer"></div><button class="btn btn-ghost btn-sm" onclick="if(CART.length){confirmAction('Vider le panier ?',()=>{CART=[];renderCart();})}">Vider</button></div>
      <div class="field"><label>Client (optionnel)</label><input id="posClient" placeholder="Nom du client"></div>
      <div id="cartItems"></div>
      <div id="cartTotals"></div>
      <div class="field" style="margin-top:10px;"><label>Montant payé (Ar)</label><input id="posPaid" type="number" min="0" oninput="renderCartTotalsOnly()"></div>
      <div id="changeRow" class="small-note"></div>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="finalizeSale(false)">✅ Valider la vente</button>
      <button class="btn btn-gold btn-block" style="margin-top:8px;" onclick="finalizeSale(true)">💳 Vente à crédit</button>
    </div>
  </div>`;
  renderPosGrid();
  renderCart();
}

function renderPosGrid(){
  const grid = document.getElementById('posGrid');
  if(!grid) return;
  let list = DB.products.filter(p=>p.active!==false);
  if(POS_SEARCH){ const q=POS_SEARCH.toLowerCase(); list = list.filter(p=>p.name.toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q)); }
  if(!list.length){ grid.innerHTML = '<div class="empty-state">Aucun produit.</div>'; return; }
  grid.innerHTML = list.map(p=>{
    const stockQty = (DB.stockLevels[p.id]||{})[POS_STOCK] || 0;
    const totalAllStores = totalStock(p.id);
    const mainUnit = p.units[0];
    const price = POS_MODE==='gros' ? (mainUnit.priceWholesale||mainUnit.priceRetail) : (mainUnit.priceRetail||mainUnit.priceWholesale);
    const elsewhereHint = (stockQty<=0 && totalAllStores>stockQty) ? `<div class="hint" style="margin-top:2px;color:var(--orange);">Stock disponible dans un autre magasin (${fmtNum(totalAllStores)} au total) — faites un transfert.</div>` : '';
    return `<div class="prod-card" onclick="addToCart('${p.id}')">
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pmeta">${escapeHtml(mainUnit.name)} — ${fmtAr(price)}</div>
      <div class="pstock" style="color:${stockQty<=0?'var(--red)':stockQty<=(p.minThresholdBase||0)?'var(--orange)':'var(--green-700)'}">Stock ici : ${fmtNum(stockQty)}</div>
      ${elsewhereHint}
    </div>`;
  }).join('');
}

function addToCart(productId){
  const p = byId(DB.products, productId);
  if(!p) return;
  const unit = p.units[0];
  let withBottle = null;
  if(p.special==='bottle') withBottle = true; // par défaut avec bouteille, modifiable dans le panier
  const existing = CART.find(it=>it.productId===productId && it.unitId===unit.id && it.withBottle===withBottle);
  if(existing){ existing.qty += 1; }
  else {
    CART.push({ productId, productName:p.name, unitId:unit.id, unitName:unit.name, unitQtyInBase:unit.qtyInBase, qty:1, mode:POS_MODE, withBottle, special:p.special });
  }
  renderCart();
}

function unitPriceFor(item){
  const p = byId(DB.products, item.productId);
  const unit = byId(p.units, item.unitId) || p.units[0];
  if(p.special==='bottle'){
    return item.withBottle ? (unit.priceWithBottle||0) : (unit.priceWithoutBottle||0);
  }
  return item.mode==='gros' ? (unit.priceWholesale||unit.priceRetail||0) : (unit.priceRetail||unit.priceWholesale||0);
}

function renderCart(){
  const wrap = document.getElementById('cartItems');
  if(!wrap) return;
  if(!CART.length){ wrap.innerHTML = '<div class="empty-state" style="padding:24px 0;">Panier vide. Cliquez sur un produit à gauche.</div>'; renderCartTotalsOnly(); return; }
  wrap.innerHTML = CART.map((it,i)=>{
    const p = byId(DB.products,it.productId);
    const unitPrice = unitPriceFor(it);
    return `<div class="cart-item">
      <div class="ci-name">
        <div>${escapeHtml(it.productName)}</div>
        <div>
          <select onchange="changeCartUnit(${i}, this.value)" style="font-size:11px;border:1px solid var(--line);border-radius:6px;">
            ${p.units.map(u=>`<option value="${u.id}" ${u.id===it.unitId?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
          </select>
          ${it.special==='bottle' ? `<select onchange="CART[${i}].withBottle=(this.value==='1');renderCart();" style="font-size:11px;border:1px solid var(--line);border-radius:6px;margin-left:4px;">
            <option value="1" ${it.withBottle?'selected':''}>Avec bouteille</option>
            <option value="0" ${!it.withBottle?'selected':''}>Sans bouteille</option>
          </select>` : `<select onchange="CART[${i}].mode=this.value;renderCart();" style="font-size:11px;border:1px solid var(--line);border-radius:6px;margin-left:4px;">
            <option value="detail" ${it.mode==='detail'?'selected':''}>Détail</option>
            <option value="gros" ${it.mode==='gros'?'selected':''}>Gros</option>
          </select>`}
          · ${fmtAr(unitPrice)}
        </div>
      </div>
      <div class="qty-ctl">
        <button onclick="incCartQty(${i},-1)">−</button>
        <input type="number" min="0.01" step="any" value="${it.qty}" onchange="setCartQty(${i}, this.value)">
        <button onclick="incCartQty(${i},1)">+</button>
      </div>
      <button class="btn btn-icon btn-sm" onclick="CART.splice(${i},1);renderCart();">✕</button>
    </div>`;
  }).join('');
  renderCartTotalsOnly();
}
function changeCartUnit(i, unitId){ const p = byId(DB.products, CART[i].productId); const u = byId(p.units, unitId); CART[i].unitId = unitId; CART[i].unitName = u.name; CART[i].unitQtyInBase = u.qtyInBase; renderCart(); }
function incCartQty(i, delta){ CART[i].qty = Math.max(0.01, (parseFloat(CART[i].qty)||0) + delta); renderCart(); }
function setCartQty(i, val){ CART[i].qty = Math.max(0.01, parseFloat(val)||1); renderCart(); }

function cartTotal(){ return CART.reduce((a,it)=> a + unitPriceFor(it)*it.qty, 0); }

function renderCartTotalsOnly(){
  const totBox = document.getElementById('cartTotals');
  if(!totBox) return;
  const total = cartTotal();
  const paidInput = document.getElementById('posPaid');
  const paid = paidInput ? (parseFloat(paidInput.value)||0) : 0;
  const remaining = Math.max(0, total-paid);
  totBox.innerHTML = `
    <div class="cart-total-row"><span>Total</span><span><b>${fmtAr(total)}</b></span></div>
    <div class="cart-total-row"><span>Montant payé</span><span>${fmtAr(paid)}</span></div>
    <div class="cart-total-row grand"><span>${paid>=total? 'Monnaie à rendre':'Reste à payer (si crédit)'}</span><span style="color:${paid>=total?'inherit':'var(--red)'}">${paid>=total? fmtAr(paid-total) : fmtAr(remaining)}</span></div>
  `;
  const changeRow = document.getElementById('changeRow');
  if(changeRow){
    if(paid<=0){ changeRow.innerHTML = '<span class="hint" style="margin:0;">Laissez à 0 puis cliquez "Vente à crédit" si le client ne paie rien pour l\u2019instant.</span>'; }
    else if(paid<total){ changeRow.innerHTML = `<span style="color:var(--red)">Paiement partiel — le reste (${fmtAr(remaining)}) sera enregistré comme crédit client si vous cliquez sur "Vente à crédit".</span>`; }
    else { changeRow.innerHTML = ''; }
  }
}

function nextInvoiceNumber(){
  const n = DB.settings.nextInvoiceNo || 1;
  DB.settings.nextInvoiceNo = n+1;
  return String(n).padStart(6,'0');
}

function finalizeSale(isCredit){
  if(!CART.length){ toast('Le panier est vide.', 'err'); return; }
  // vérifier stock suffisant
  for(const it of CART){
    const avail = (DB.stockLevels[it.productId]||{})[POS_STOCK] || 0;
    const needed = it.qty * it.unitQtyInBase;
    if(needed > avail + 0.0001){
      toast(`Stock insuffisant pour ${it.productName} (disponible: ${fmtNum(avail)}).`, 'err');
      return;
    }
  }
  const total = cartTotal();
  const paidInput = document.getElementById('posPaid');
  let paid = paidInput ? (parseFloat(paidInput.value)||0) : 0;
  const clientName = document.getElementById('posClient').value.trim();
  if(isCredit && !clientName){ toast('Le nom du client est requis pour une vente à crédit.', 'err'); return; }
  if(!isCredit && paid < total){
    toast('Le montant payé est inférieur au total. Utilisez "Vente à crédit" si le client ne paie pas tout.', 'err'); return;
  }
  if(isCredit && paid > total) paid = total;

  const sale = {
    id: uid('s'), number: nextInvoiceNumber(), date: nowISO(),
    cashierId: SESSION.user.id, cashierName: SESSION.user.fullName||SESSION.user.username, cashierUsername: SESSION.user.username,
    clientName: clientName || 'Client comptoir', stockId: POS_STOCK,
    items: CART.map(it=>({ productId:it.productId, name:it.productName, unitId:it.unitId, unitName:it.unitName, unitQtyInBase:it.unitQtyInBase, qty:it.qty, unitPrice: unitPriceFor(it), mode:it.mode, withBottle:it.withBottle })),
    total, paid, change: Math.max(0,paid-total), status:'valid', isCredit: !!isCredit,
  };
  // déduire le stock
  CART.forEach(it=>{
    const wasAbove = ((DB.stockLevels[it.productId][POS_STOCK]||0)) > (byId(DB.products,it.productId).minThresholdBase||0);
    DB.stockLevels[it.productId][POS_STOCK] = roundQty((DB.stockLevels[it.productId][POS_STOCK]||0) - it.qty*it.unitQtyInBase);
    DB.stockMovements.unshift({id:uid('mv'), type:'sale', productId:it.productId, productName:it.productName, qty: -(it.qty*it.unitQtyInBase), fromStock:POS_STOCK, toStock:null, date: nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note:'Vente '+sale.number});
    const nowLevel = DB.stockLevels[it.productId][POS_STOCK]||0;
    const prod = byId(DB.products,it.productId);
    if(wasAbove && nowLevel <= (prod.minThresholdBase||0)){
      addNotification('lowstock', `Stock faible : ${prod.name} (${fmtNum(nowLevel)} restant(s)).`);
    }
  });
  DB.sales.unshift(sale);

  if(isCredit && total-paid>0){
    DB.credits.unshift({ id: uid('cr'), clientName: sale.clientName, phone:'', date: nowISO(), total: total, paid: paid, remaining: total-paid, payments: paid>0?[{date:nowISO(), amount:paid, user:SESSION.user.username}]:[], notes:'Vente '+sale.number, saleId: sale.id });
    addNotification('credit', `Vente à crédit ${sale.number} — ${sale.clientName} doit ${fmtAr(total-paid)}.`);
  }

  addNotification('sale', `Nouvelle vente ${sale.number} — ${sale.clientName} — ${fmtAr(total)}`);
  logHistory('Vente enregistrée', `Facture ${sale.number} — ${fmtAr(total)}`);
  saveDB();
  CART = [];
  printReceipt(sale);
  refresh();
  toast('Vente enregistrée : facture n°'+sale.number);
}

function printReceipt(sale){
  const area = document.getElementById('printArea');
  const cashierId = sale.cashierUsername || sale.cashierId || '';
  area.innerHTML = `<div class="receipt">
    <div class="center"><img src="${LOGO_B64}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" alt="logo"><br>
    <b style="font-size:14px;">${escapeHtml(DB.settings.shopName||'TR Naja')}</b><br>
    <span style="font-size:10px;">Vente en gros et en détail</span></div>
    <hr>
    Ticket n° ${escapeHtml(sale.number)}<br>
    Date : ${fmtDate(sale.date)}<br>
    Caissier : ${escapeHtml(sale.cashierName)} (${escapeHtml(cashierId)})<br>
    Client : ${escapeHtml(sale.clientName)}
    <hr>
    <table style="width:100%;">
      <thead><tr><th style="text-align:left;">Article</th><th>Qté</th><th style="text-align:right;">Prix</th></tr></thead>
      <tbody>
      ${sale.items.map(it=>`<tr><td colspan="3" style="padding-top:6px;">${escapeHtml(it.name)} (${escapeHtml(it.unitName)})</td></tr>
      <tr><td></td><td style="text-align:center;">${fmtNum(it.qty)}</td><td style="text-align:right;">${fmtAr(it.qty*it.unitPrice)}</td></tr>`).join('')}
      </tbody>
    </table>
    <hr>
    <table style="width:100%;font-size:13px;">
      <tr><td><b>TOTAL</b></td><td style="text-align:right;"><b>${fmtAr(sale.total)}</b></td></tr>
      <tr><td>Payé</td><td style="text-align:right;">${fmtAr(sale.paid)}</td></tr>
      ${sale.isCredit && sale.total-sale.paid>0 ? `<tr><td>Reste (crédit)</td><td style="text-align:right;">${fmtAr(sale.total-sale.paid)}</td></tr>` : `<tr><td>Monnaie</td><td style="text-align:right;">${fmtAr(sale.change)}</td></tr>`}
    </table>
    <hr>
    <div class="center">Merci de votre confiance !<br>À bientôt chez ${escapeHtml(DB.settings.shopName||'TR Naja')}</div>
  </div>`;

function filteredSalesList(){
  const q = (document.getElementById('saleSearch').value||'').toLowerCase();
  const statusF = document.getElementById('saleStatusFilter').value;
  const period = document.getElementById('salePeriodFilter').value;
  let list = isCashier() ? DB.sales.filter(s=>s.cashierId===SESSION.user.id) : DB.sales.slice();
  if(q) list = list.filter(s=> s.number.includes(q) || s.clientName.toLowerCase().includes(q));
  if(statusF) list = list.filter(s=>s.status===statusF);
  if(period==='day'){ const d0=todayStr(); list = list.filter(s=>s.date.slice(0,10)===d0); }
  else if(period==='month'){ const m=todayStr().slice(0,7); list = list.filter(s=>s.date.slice(0,7)===m); }
  else if(period==='year'){ const y=todayStr().slice(0,4); list = list.filter(s=>s.date.slice(0,4)===y); }
  return list;
}
function exportSalesHistoryPDF(){
  const list = filteredSalesList();
  const rows = list.map(s=>[s.number, fmtDate(s.date), s.clientName, s.cashierName, fmtAr(s.total), s.status==='valid'?(s.isCredit?'Crédit':'Validée'):'Annulée']);
  printPDFDoc('Historique des ventes', `${rows.length} vente(s)`, tableHtml(['N°','Date','Client','Caissier','Total','Statut'], rows));
}
function renderSalesTable(){
  const tbody = document.getElementById('salesTbody');
  if(!tbody) return;
  let list = filteredSalesList();
  if(!list.length){ tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Aucune vente.</div></td></tr>`; return; }
  tbody.innerHTML = list.map(s=>`
    <tr>
      <td><b>${escapeHtml(s.number)}</b></td>
      <td>${fmtDate(s.date)}</td>
      <td>${escapeHtml(s.clientName)}</td>
      <td>${escapeHtml(s.cashierName)}</td>
      <td>${fmtAr(s.total)}</td>
      <td>${s.status==='valid'? (s.isCredit?'<span class="badge badge-gold">Crédit</span>':'<span class="badge badge-green">Validée</span>') : '<span class="badge badge-red">Annulée</span>'}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-icon btn-sm" title="Réimprimer" onclick='printReceipt(${JSON.stringify(s).replace(/'/g,"&#39;")})'>🖨️</button>
        ${s.status==='valid' && can('cancelSale') ? `<button class="btn btn-icon btn-sm" title="Annuler" onclick="openCancelSaleModal('${s.id}')">↩️</button>` : ''}

function openCancelSaleModal(saleId){
  openModal({
    title:'Annuler la vente',
    bodyHtml: `<div class="field"><label>Motif de l'annulation *</label><input id="cancelReason" placeholder="ex: erreur de saisie, produit retourné..."></div>
    <p class="small-note">La marchandise sera remise en stock. Cette action reste tracée dans l'historique et n'est pas réversible.</p>`,
    footHtml: `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-danger" onclick="cancelSale('${saleId}')">Confirmer l'annulation</button>`
  });
}
function cancelSale(saleId){
  const reason = document.getElementById('cancelReason').value.trim();
  if(!reason){ toast('Le motif est obligatoire.', 'err'); return; }
  const sale = byId(DB.sales, saleId);
  sale.status='cancelled'; sale.cancelReason=reason; sale.cancelledBy=SESSION.user.username; sale.cancelledAt=nowISO();
  sale.items.forEach(it=>{
    if(!DB.stockLevels[it.productId]) DB.stockLevels[it.productId]={};
    DB.stockLevels[it.productId][sale.stockId] = roundQty((DB.stockLevels[it.productId][sale.stockId]||0) + it.qty*it.unitQtyInBase);
    DB.stockMovements.unshift({id:uid('mv'), type:'cancel_sale', productId:it.productId, productName:it.name, qty: it.qty*it.unitQtyInBase, fromStock:null, toStock:sale.stockId, date:nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note:'Annulation vente '+sale.number});
  });
  if(sale.isCredit){ const cr = DB.credits.find(x=>x.saleId===sale.id); if(cr){ cr.remaining = 0; cr.notes += ' (vente annulée)'; } }
  addNotification('cancel', `Vente ${sale.number} annulée par ${SESSION.user.username} — motif: ${reason}`);
  logHistory('Vente annulée', `Facture ${sale.number} — motif: ${reason}`);
  saveDB(); closeModal(); refresh();
  toast('Vente annulée, stock remis à jour.');
}

function stockName(id){ if(!id) return '—'; const s = byId(DB.stocks,id); return s?s.name:'—'; }

function doStockEntry(){
  const productId = document.getElementById('entryProduct').value;
  const stockId = document.getElementById('entryStock').value;
  const qty = parseFloat(document.getElementById('entryQty').value);
  const note = document.getElementById('entryNote').value.trim();
  if(!productId || !qty || qty<=0){ toast('Veuillez indiquer un produit et une quantité valide.', 'err'); return; }
  if(!DB.stockLevels[productId]) DB.stockLevels[productId]={};
  DB.stockLevels[productId][stockId] = roundQty((DB.stockLevels[productId][stockId]||0) + qty);
  const p = byId(DB.products, productId);
  DB.stockMovements.unshift({id:uid('mv'), type:'entry', productId, productName:p.name, qty, fromStock:null, toStock:stockId, date:nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note});
  logHistory('Entrée de stock', `${p.name} +${qty} (${stockName(stockId)})`);
  saveDB(); toast('Entrée de stock enregistrée.'); switchStockOpsTab('entry');
}
function updateTransferAvail(){
  const pid = document.getElementById('trProduct').value;
  const from = document.getElementById('trFrom').value;
  const avail = (DB.stockLevels[pid]||{})[from] || 0;
  document.getElementById('trAvail').value = fmtNum(avail);
}
function doStockTransfer(){
  const productId = document.getElementById('trProduct').value;
  const from = document.getElementById('trFrom').value;
  const to = document.getElementById('trTo').value;
  const qty = parseFloat(document.getElementById('trQty').value);
  if(from===to){ toast('Le stock d’origine et de destination doivent être différents.', 'err'); return; }
  if(!qty || qty<=0){ toast('Quantité invalide.', 'err'); return; }
  const avail = (DB.stockLevels[productId]||{})[from] || 0;
  if(qty > avail){ toast('Quantité disponible insuffisante dans le stock d’origine.', 'err'); return; }
  DB.stockLevels[productId][from] = roundQty(DB.stockLevels[productId][from] - qty);
  DB.stockLevels[productId][to] = roundQty((DB.stockLevels[productId][to]||0) + qty);
  const p = byId(DB.products, productId);
  const now = nowISO();
  DB.stockMovements.unshift({id:uid('mv'), type:'transfer_out', productId, productName:p.name, qty:-qty, fromStock:from, toStock:to, date:now, userId:SESSION.user.id, userName:SESSION.user.username, note:'Transfert'});
  logHistory('Transfert de stock', `${p.name}: ${qty} de ${stockName(from)} vers ${stockName(to)}`);
  saveDB(); toast('Transfert effectué.'); switchStockOpsTab('transfer');
}

        return `<tr data-pid="${p.id}" data-name="${escapeHtml(p.name.toLowerCase())}"><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.location||'—')} ${escapeHtml(p.locationNumber||'')}</td>

        <td><input type="number" class="counted-input filter" style="width:100px;" step="any" oninput="updateInvDiff(this)"></td>
        <td class="diff-cell">—</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="field" style="margin-top:14px;"><label>Observations</label><input id="invNotes" placeholder="Remarques générales sur l'inventaire"></div>
    <div class="toolbar" style="margin-top:8px;"><button class="btn btn-primary" onclick="saveInventory('${stockId}')">💾 Enregistrer l'inventaire</button>
    <button class="btn btn-ghost" onclick="exportInventorySheetPDF('${stockId}')">🖨️ Exporter en PDF</button></div>
  </div>`;
}
function filterInventoryRows(){
  const q = (document.getElementById('invSearch').value||'').toLowerCase();
  document.querySelectorAll('#invTbody tr').forEach(r=>{ r.style.display = r.dataset.name.includes(q) ? '' : 'none'; });
}
function exportInventorySheetPDF(stockId){
  const rows = Array.from(document.querySelectorAll('#invTbody tr')).map(r=>{
    const cells = r.querySelectorAll('td');
    return [cells[0].textContent, cells[1].textContent, cells[2].textContent, cells[3].textContent, r.querySelector('.counted-input').value||'—', cells[5].textContent];
  });
  printPDFDoc('Fiche d\u2019inventaire — '+stockName(stockId), fmtDateOnly(nowISO()), tableHtml(['Produit','Emplacement','Stock théorique','Unité','Compté','Écart'], rows));
}
function updateInvDiff(input){
  const row = input.closest('tr');
  const theo = parseFloat(row.querySelector('.theo-cell').textContent.replace(/\\s/g,''))||0;
  const counted = parseFloat(input.value);
  const diffCell = row.querySelector('.diff-cell');
  if(isNaN(counted)){ diffCell.textContent='—'; diffCell.style.color=''; row.style.background=''; return; }
  const diff = counted-theo;
  diffCell.textContent = (diff>0?'+':'')+fmtNum(diff);
  diffCell.style.color = diff===0? 'var(--green-700)' : (diff<0? 'var(--red)':'var(--orange)');
  row.style.background = diff!==0 ? '#fdf1de' : '';
}
function saveInventory(stockId){
  const rows = document.querySelectorAll('#invBody tr[data-pid]');
  const lines = [];
  rows.forEach(r=>{
    const pid = r.dataset.pid;
    const counted = parseFloat(r.querySelector('.counted-input').value);
    if(isNaN(counted)) return;
    const theo = (DB.stockLevels[pid]||{})[stockId] || 0;
    lines.push({ productId:pid, theoretical:theo, counted, diff: counted-theo });
  });
  if(!lines.length){ toast('Saisissez au moins une quantité comptée.', 'err'); return; }
  confirmAction(`Enregistrer l'inventaire et ajuster le stock réel pour ${lines.length} produit(s) ?`, ()=>{
    lines.forEach(l=>{
      if(!DB.stockLevels[l.productId]) DB.stockLevels[l.productId]={};
      DB.stockLevels[l.productId][stockId] = roundQty(l.counted);
      if(l.diff!==0){
        const p = byId(DB.products,l.productId);
        DB.stockMovements.unshift({id:uid('mv'), type:'inventory_adjust', productId:l.productId, productName:p.name, qty:l.diff, fromStock:null, toStock:stockId, date:nowISO(), userId:SESSION.user.id, userName:SESSION.user.username, note:'Ajustement inventaire'});
      }
    });
    DB.inventories.unshift({ id: uid('inv'), date: nowISO(), stockId, userId:SESSION.user.id, userName:SESSION.user.username, lines, notes: document.getElementById('invNotes').value.trim() });
    logHistory('Inventaire réalisé', `${stockName(stockId)} — ${lines.length} lignes`);
    saveDB(); toast('Inventaire enregistré, stock ajusté.'); render_inventory(document.getElementById('pageContent'));
  }, 'Enregistrer');
}
function showInventoryHistory(){
  openModal({ title:'Historique des inventaires', large:true, bodyHtml: `
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Stock</th><th>Utilisateur</th><th>Lignes</th><th>Écarts</th></tr></thead>

}

function getOpenCashSession(){ return DB.cashSessions.find(s=>s.status==='open'); }
function render_cash(c){
  const session = getOpenCashSession();
  const todaySalesCash = session ? DB.sales.filter(s=>s.status==='valid' && s.date>=session.openedAt && !s.isCredit) : [];
  const todaySalesCredit = session ? DB.sales.filter(s=>s.status==='valid' && s.date>=session.openedAt && s.isCredit) : [];
  const cashIn = todaySalesCash.reduce((a,s)=>a+s.paid,0) + todaySalesCredit.reduce((a,s)=>a+s.paid,0);
  const expensesSince = session ? DB.expenses.filter(e=>e.date>=session.openedAt).reduce((a,e)=>a+e.amount,0) : 0;
  const theoretical = session ? session.openingAmount + cashIn - expensesSince : 0;

  const topBlock = !session ? `<div class="card" style="max-width:480px;">
      <div class="card-head"><h3>Ouverture de caisse</h3></div>
      <div class="field"><label>Montant initial en caisse (Ar)</label><input type="number" id="openingAmount" min="0" value="0"></div>
      <button class="btn btn-primary btn-block" onclick="openCashSession()">Ouvrir la caisse</button>
    </div>` : `
    <div class="grid grid-3">
      <div class="kpi"><div class="lbl">Caisse initiale</div><div class="val">${fmtAr(session.openingAmount)}</div></div>
      <div class="kpi"><div class="lbl">Encaissements</div><div class="val">${fmtAr(cashIn)}</div></div>
      <div class="kpi"><div class="lbl">Dépenses depuis ouverture</div><div class="val">${fmtAr(expensesSince)}</div></div>
    </div>
    <div class="card" style="margin-top:18px;max-width:520px;">
      <div class="card-head"><h3>Caisse théorique</h3></div>
      <div class="kpi" style="box-shadow:none;border:none;padding:0;"><div class="val" style="font-size:30px;">${fmtAr(theoretical)}</div></div>
      <hr class="sep">
      <div class="field"><label>Montant réellement compté (Ar)</label><input type="number" id="realAmount" min="0"></div>
      <button class="btn btn-primary btn-block" onclick="closeCashSession(${theoretical})">🔒 Clôturer la caisse</button>
    </div>
    <div class="card" style="margin-top:18px;">
      <div class="card-head"><h3>Ventes depuis l'ouverture</h3><div class="spacer"></div>
        <select class="filter" id="cashSaleCashierFilter" onchange="renderCashSalesTable()">
          <option value="">Tous les caissiers</option>
          ${DB.users.map(u=>`<option value="${u.id}">${escapeHtml(u.fullName||u.username)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap"><table><thead><tr><th>N°</th><th>Heure</th><th>Client</th><th>Caissier</th><th>Total</th><th>Payé</th></tr></thead>
      <tbody id="cashSalesTbody"></tbody></table></div>
    </div>`;

  c.innerHTML = topBlock + `
    <div class="card" style="margin-top:18px;">
      <div class="card-head"><h3>🗄️ Historique des clôtures de caisse</h3><div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" onclick="exportCashHistoryPDF()">🖨️ PDF</button>
      </div>
      <div class="toolbar">
        <select class="filter" id="cashHistCashierFilter" onchange="renderCashHistoryTable()">
          <option value="">Tous les responsables</option>
          ${[...new Set(DB.cashSessions.map(s=>s.closedBy).filter(Boolean))].map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('')}
        </select>
        <input type="date" class="filter" id="cashHistDateFrom" onchange="renderCashHistoryTable()">
        <span class="hint">à</span>
        <input type="date" class="filter" id="cashHistDateTo" onchange="renderCashHistoryTable()">
      </div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Ouverture</th><th>Théo.</th><th>Réel</th><th>Écart</th><th>Ventes</th><th>Responsable</th></tr></thead>
      <tbody id="cashHistTbody"></tbody></table></div>
    </div>
  `;
  if(session) renderCashSalesTable();
  renderCashHistoryTable();
}
function renderCashSalesTable(){
  const tbody = document.getElementById('cashSalesTbody');
  if(!tbody) return;
  const session = getOpenCashSession();
  const cashierF = document.getElementById('cashSaleCashierFilter').value;
  let list = DB.sales.filter(s=>s.status==='valid' && s.date>=session.openedAt);
  if(cashierF) list = list.filter(s=>s.cashierId===cashierF);
  list = list.sort((a,b)=>a.date<b.date?1:-1);
  tbody.innerHTML = list.length? list.map(s=>`<tr><td>${escapeHtml(s.number)}</td><td>${fmtDate(s.date)}</td><td>${escapeHtml(s.clientName)}</td><td>${escapeHtml(s.cashierName)}</td><td>${fmtAr(s.total)}</td><td>${fmtAr(s.paid)}</td></tr>`).join('') : `<tr><td colspan="6"><div class="empty-state">Aucune vente pour l'instant.</div></td></tr>`;
}
function renderCashHistoryTable(){
  const tbody = document.getElementById('cashHistTbody');
  if(!tbody) return;
  const respF = document.getElementById('cashHistCashierFilter').value;
  const dFrom = document.getElementById('cashHistDateFrom').value;
  const dTo = document.getElementById('cashHistDateTo').value;
  let list = DB.cashSessions.filter(s=>s.status==='closed');
  if(respF) list = list.filter(s=>s.closedBy===respF);
  if(dFrom) list = list.filter(s=>s.closedAt.slice(0,10)>=dFrom);
  if(dTo) list = list.filter(s=>s.closedAt.slice(0,10)<=dTo);
  tbody.innerHTML = list.length? list.map(s=>`<tr>
    <td>${fmtDateOnly(s.closedAt)}</td><td>${fmtDate(s.openedAt)}</td><td>${fmtAr(s.theoretical)}</td><td>${fmtAr(s.closingAmountReal)}</td>
    <td style="color:${s.difference===0?'var(--green-700)':s.difference<0?'var(--red)':'var(--orange)'};font-weight:700;">${fmtAr(s.difference)}</td>
    <td>${s.salesCount||0} (${fmtAr(s.salesTotal||0)})</td><td>${escapeHtml(s.closedBy)}</td>
  </tr>`).join('') : `<tr><td colspan="7"><div class="empty-state">Aucune clôture enregistrée.</div></td></tr>`;
}
function exportCashHistoryPDF(){
  const rows = DB.cashSessions.filter(s=>s.status==='closed').map(s=>[fmtDateOnly(s.closedAt), fmtAr(s.theoretical), fmtAr(s.closingAmountReal), fmtAr(s.difference), String(s.salesCount||0), s.closedBy]);
  printPDFDoc('Historique des clôtures de caisse', '', tableHtml(['Date','Théorique','Réel','Écart','Nb ventes','Responsable'], rows));
}
function openCashSession(){
  const amt = parseFloat(document.getElementById('openingAmount').value)||0;
  DB.cashSessions.unshift({ id:uid('cs'), date: todayStr(), openedBy:SESSION.user.username, openingAmount:amt, openedAt: nowISO(), status:'open' });
  logHistory('Ouverture de caisse', fmtAr(amt));
  addNotification('cash', `Caisse ouverte par ${SESSION.user.username} — ${fmtAr(amt)}`);
  saveDB(); refresh(); toast('Caisse ouverte.');
}
function closeCashSession(theoretical){
  const real = parseFloat(document.getElementById('realAmount').value);
  if(isNaN(real)){ toast('Veuillez indiquer le montant compté.', 'err'); return; }
  const session = getOpenCashSession();
  session.status='closed'; session.closedBy=SESSION.user.username; session.closingAmountReal=real; session.theoretical=theoretical; session.difference=real-theoretical; session.closedAt=nowISO();
  const salesInSession = DB.sales.filter(s=>s.status==='valid' && s.date>=session.openedAt && s.date<=session.closedAt);
  session.salesCount = salesInSession.length;
  session.salesTotal = salesInSession.reduce((a,s)=>a+s.total,0);
  addNotification('cash', `Caisse clôturée par ${SESSION.user.username} — écart ${fmtAr(real-theoretical)}`);
  logHistory('Clôture de caisse', `Théorique ${fmtAr(theoretical)} / Réel ${fmtAr(real)} / Écart ${fmtAr(real-theoretical)}`);
  saveDB(); refresh();
  toast('Caisse clôturée. Écart : ' + fmtAr(real-theoretical));
}

function openPaymentModal(id){
  const cr = byId(DB.credits, id);
  openModal({ title:'Enregistrer un paiement — ' + cr.clientName, bodyHtml:`
    <p class="small-note">Reste à payer : <b>${fmtAr(cr.remaining)}</b></p>
    <div class="field"><label>Montant payé (Ar)</label><input type="number" id="payAmount" min="0" max="${cr.remaining}"></div>
  `, footHtml:`<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="savePayment('${id}')">Enregistrer</button>` });
}
function savePayment(id){
  const cr = byId(DB.credits,id);
  const amt = parseFloat(document.getElementById('payAmount').value);
  if(!amt || amt<=0){ toast('Montant invalide.', 'err'); return; }
  const applied = Math.min(amt, cr.remaining);
  cr.paid += applied; cr.remaining -= applied;
  cr.payments.push({ date: nowISO(), amount: applied, user: SESSION.user.username });
  addNotification('credit', `Paiement reçu de ${cr.clientName} — ${fmtAr(applied)} (reste ${fmtAr(cr.remaining)}).`);
  logHistory('Paiement crédit', `${cr.clientName} — ${fmtAr(applied)}`);
  saveDB(); closeModal(); refresh(); toast('Paiement enregistré. Reste : ' + fmtAr(cr.remaining));
}
function showCreditHistory(id){
  const cr = byId(DB.credits,id);
  openModal({ title:'Historique — ' + cr.clientName, bodyHtml:`
    <p>Total: ${fmtAr(cr.total)} — Payé: ${fmtAr(cr.paid)} — Reste: ${fmtAr(cr.remaining)}</p>

}
