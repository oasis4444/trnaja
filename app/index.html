      ${[['day','Jour'],['week','Semaine'],['month','Mois'],['year','Année']].map(([k,l])=>`<button class="${STATS_PERIOD===k?'active':''}" onclick="STATS_PERIOD='${k}';render_stats(document.getElementById('pageContent'))">${l}</button>`).join('')}
    </div>
    <div class="toolbar"><div class="spacer"></div><button class="btn btn-ghost" onclick="exportStatsBilan()">📤 Exporter le bilan (Excel)</button><button class="btn btn-ghost" onclick="exportStatsBilanPDF()">🖨️ Télécharger en PDF</button></div>
    <div id="statsBody"></div>
  `;
  renderStatsBody();
}
function periodRange(){
  const end = new Date();
  const start = new Date();
  if(STATS_PERIOD==='day') start.setHours(0,0,0,0);
  else if(STATS_PERIOD==='week') start.setDate(start.getDate()-6);
  else if(STATS_PERIOD==='month') start.setDate(start.getDate()-29);
  else start.setMonth(0,1);
  return [start.toISOString(), end.toISOString()];
}
function renderStatsBody(){
  const [s,e] = periodRange();
  const sales = salesBetween(s,e);
  const expenses = DB.expenses.filter(x=>x.date>=s && x.date<=e);
  const total = sumSales(sales);
  const expTotal = expenses.reduce((a,x)=>a+x.amount,0);
  const showProfit = isAdmin() || can('seeProfit');
  const profit = sales.reduce((a,x)=>a+estimateProfit(x),0);

  // group by day for chart
  const byDay = {};
  sales.forEach(sale=>{ const d = sale.date.slice(0,10); byDay[d]=(byDay[d]||0)+sale.total; });
  const days = Object.keys(byDay).sort();
  const maxV = Math.max(1, ...Object.values(byDay));
  const chart = days.length ? `<svg viewBox="0 0 ${Math.max(400,days.length*60)} 200" style="width:100%;height:200px;">
    ${days.map((d,i)=>{ const bw=40,gap=20,x=15+i*(bw+gap); const h=Math.round((byDay[d]/maxV)*140); const y=170-h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="#25a862"></rect><text x="${x+bw/2}" y="188" text-anchor="middle" font-size="9" fill="#4a5a51">${d.slice(5)}</text>`; }).join('')}
  </svg>` : '<div class="empty-state">Aucune vente sur cette période.</div>';

  const qtyByProd = {};
  sales.forEach(sale=>sale.items.forEach(it=>{ qtyByProd[it.productId]=(qtyByProd[it.productId]||0)+it.qty*(it.unitQtyInBase||1); }));
  const top = Object.entries(qtyByProd).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const creditsTotal = DB.credits.reduce((a,x)=>a+x.remaining,0);
  const mvSum = DB.stockMovements.filter(m=>m.date>=s&&m.date<=e).length;

  document.getElementById('statsBody').innerHTML = `
    <div class="grid grid-4">
      <div class="kpi"><div class="lbl">Chiffre d'affaires</div><div class="val">${fmtAr(total)}</div></div>
      <div class="kpi"><div class="lbl">Bénéfice estimé</div><div class="val">${showProfit? fmtAr(profit) : '••••••'}</div></div>
      <div class="kpi"><div class="lbl">Dépenses</div><div class="val">${fmtAr(expTotal)}</div></div>
      <div class="kpi"><div class="lbl">Crédits en cours</div><div class="val">${fmtAr(creditsTotal)}</div></div>
    </div>
    <div class="card" style="margin-top:18px;"><div class="card-head"><h3>Évolution des ventes</h3></div>${chart}</div>
    <div class="two-col" style="margin-top:18px;">
      <div class="card"><div class="card-head"><h3>Produits les plus vendus</h3></div>
        ${top.length? `<div class="table-wrap"><table><thead><tr><th>Produit</th><th>Qté vendue</th></tr></thead><tbody>${top.map(([pid,q])=>`<tr><td>${escapeHtml((byId(DB.products,pid)||{}).name||'—')}</td><td>${fmtNum(q)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state">Aucune donnée.</div>'}
      </div>
      <div class="card"><div class="card-head"><h3>Résumé du bilan</h3></div>
        <table>
          <tr><td>Nombre de ventes</td><td style="text-align:right;font-weight:700;">${sales.length}</td></tr>
          <tr><td>Mouvements de stock</td><td style="text-align:right;font-weight:700;">${mvSum}</td></tr>
          <tr><td>Dépenses enregistrées</td><td style="text-align:right;font-weight:700;">${expenses.length}</td></tr>
          <tr><td>Règlements clients reçus</td><td style="text-align:right;font-weight:700;">${DB.credits.filter(cr=>cr.payments.some(p=>p.date>=s&&p.date<=e)).length}</td></tr>
        </table>
        <button class="btn btn-ghost" style="margin-top:14px;" onclick="window.print()">🖨️ Imprimer ce bilan</button>
      </div>
    </div>
  `;
}

function filteredJournalList(){
  const q = (document.getElementById('journalSearch').value||'').toLowerCase();
  const period = document.getElementById('journalPeriod').value;
  let list = DB.history;
  if(period==='day'){ const d0=todayStr(); list = list.filter(h=>h.date.slice(0,10)===d0); }
  else if(period==='month'){ const m = todayStr().slice(0,7); list = list.filter(h=>h.date.slice(0,7)===m); }
  else if(period==='year'){ const y = todayStr().slice(0,4); list = list.filter(h=>h.date.slice(0,4)===y); }
  if(q) list = list.filter(h=> (h.userName||'').toLowerCase().includes(q) || h.action.toLowerCase().includes(q) || (h.details||'').toLowerCase().includes(q));
  return list;
}
function renderJournalTable(){
  const list = filteredJournalList();
  document.getElementById('journalTbody').innerHTML = list.slice(0,500).map(h=>`
    <tr><td>${fmtDateOnly(h.date)}</td><td>${new Date(h.date).toLocaleTimeString('fr-FR')}</td><td>${escapeHtml(h.userName)}</td><td><b>${escapeHtml(h.action)}</b></td><td>${escapeHtml(h.details)}</td></tr>

function exportJournalPDF(){
  const list = filteredJournalList();
  const rows = list.map(h=>[fmtDateOnly(h.date), new Date(h.date).toLocaleTimeString('fr-FR'), h.userName, h.action, h.details||'']);
  printPDFDoc('Journal / Historique des opérations', `${rows.length} évènement(s)`, tableHtml(['Date','Heure','Utilisateur','Action','Détails'], rows));
}

function saveUser(id){
  const username = document.getElementById('uUsername').value.trim();
  if(!username){ toast("Nom d'utilisateur requis.", 'err'); return; }
  const dup = DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==id);
  if(dup){ toast('Ce nom d’utilisateur existe déjà.', 'err'); return; }
  const role = document.getElementById('uRole').value;
  const pass = document.getElementById('uPassword').value;
  const email = document.getElementById('uEmail').value.trim();
  const permissions = {};
  ['seeProfit','cancelSale','editPurchasePrice','seeStats'].forEach(p=>{ const el = document.getElementById('perm_'+p); if(el) permissions[p]=el.checked; });

  if(id){
    const u = byId(DB.users,id);
    u.username=username; u.fullName=document.getElementById('uFullName').value.trim(); u.role=role; u.permissions=permissions; u.email=email;
    if(pass) u.passwordHash = simpleHash(pass);
    logHistory('Utilisateur modifié', username);
  } else {
    if(!pass || pass.length<4){ toast('Mot de passe requis (4 caractères min).', 'err'); return; }
    DB.users.push({ id:uid('u'), username, fullName:document.getElementById('uFullName').value.trim(), role, passwordHash: simpleHash(pass), active:true, permissions, secretQ:'', secretA:'', email });
    logHistory('Utilisateur créé', username);
  }
  saveDB(); closeModal(); render_settings(document.getElementById('pageContent')); toast('Utilisateur enregistré.');
}

  const u = byId(DB.users,id); u.active = !u.active;

/* ---------- Sauvegarde / Restauration ---------- */
function downloadBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'trnaja_sauvegarde_' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logHistory('Sauvegarde téléchargée','');
  saveDB();
  toast('Sauvegarde téléchargée.');
}
function restoreBackup(){
  const f = document.getElementById('restoreFile').files[0];
  if(!f){ toast('Choisissez un fichier de sauvegarde.', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.users || !data.products){ toast('Fichier invalide.', 'err'); return; }
      confirmAction('Cette action va remplacer TOUTES les données actuelles par celles du fichier. Continuer ?', ()=>{
        DB = data; saveDB(); toast('Données restaurées.'); location.reload();
      }, 'Restaurer', true);
    }catch(err){ toast('Fichier illisible.', 'err'); }
  };
  reader.readAsText(f);
}

  u.fullName = document.getElementById('mpFullName').value.trim();
  u.email = email;
  const secretQ = document.getElementById('mpSecretQ').value.trim();
  const secretA = document.getElementById('mpSecretA').value;
  if(secretQ) u.secretQ = secretQ;
  if(secretA) u.secretA = simpleHash(secretA);
  const curPass = document.getElementById('mpCurrentPass').value;
  const newPass = document.getElementById('mpNewPass').value;
  if(newPass){
    if(simpleHash(curPass) !== u.passwordHash){ toast('Mot de passe actuel incorrect.', 'err'); return; }

    u.passwordHash = simpleHash(newPass);
  }
  logHistory('Profil mis à jour', u.username);
  saveDB();
  closeModal();
  initAppShell();
  toast('Profil enregistré.');
}

function addNotification(type, message){
  if(!DB.notifications) DB.notifications = [];
  DB.notifications.unshift({ id: uid('nt'), date: nowISO(), type, message, read:false });
  if(DB.notifications.length > 200) DB.notifications.length = 200;
  updateNotifBell();
}
function unreadNotifCount(){ return (DB.notifications||[]).filter(n=>!n.read).length; }
function updateNotifBell(){
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const n = unreadNotifCount();
  if(n>0){ badge.style.display='flex'; badge.textContent = n>99?'99+':n; }
  else { badge.style.display='none'; }
}
function openNotifications(){
  const list = (DB.notifications||[]).slice(0,80);
  openModal({
    title: '🔔 Notifications',
    large:false,
    bodyHtml: list.length ? list.map(n=>`
      <div class="notif-row ${n.read?'':'unread'}">
        <div class="n-ico">${NOTIF_ICONS[n.type]||'🔔'}</div>
        <div style="flex:1;">
          <div class="n-txt">${escapeHtml(n.message)}</div>
          <div class="n-time">${fmtDate(n.date)}</div>
        </div>
      </div>
    `).join('') : `<div class="empty-state"><div class="em-ico">🔔</div>Aucune notification pour le moment.</div>`,
    footHtml: `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>${list.some(n=>!n.read)? `<button class="btn btn-primary" onclick="markAllNotifsRead()">Marquer tout comme vu</button>`:''}`
  });
}
function markAllNotifsRead(){
  (DB.notifications||[]).forEach(n=>n.read=true);
  saveDB(); updateNotifBell(); closeModal();
  toast('Notifications marquées comme vues.');
}
function checkExpiryNotifications(){
  if(DB.settings.lastExpiryCheck === todayStr()) return; // déjà vérifié aujourd'hui
  const exp = expiringProducts(DB.settings.expiryWarnDays||30);
  exp.forEach(p=>{
    const days = Math.ceil((new Date(p.expiryDate) - new Date())/86400000);
    const msg = days<0 ? `${p.name} est périmé.` : `${p.name} arrive à péremption dans ${days} jour(s).`;
    addNotification('expiry', msg);
  });
  const low = lowStockProducts();
  low.forEach(p=>{ addNotification('lowstock', `Stock faible : ${p.name} (${fmtNum(totalStock(p.id))} restant(s)).`); });
  DB.settings.lastExpiryCheck = todayStr();
  saveDB();
}

/* =========================================================
   EXPORT EXCEL / CSV (avec repli automatique hors-ligne)
========================================================= */
function toCSVString(headers, rows){
  const esc = v => { v = (v===null||v===undefined)?'':String(v); if(/[;"\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; };
  const lines = [headers.map(esc).join(';')];
  rows.forEach(r=> lines.push(r.map(esc).join(';')));
  return '\uFEFF' + lines.join('\r\n'); // BOM pour compatibilité Excel/accents
}
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function exportData(filenameBase, sheetName, headers, rows){
  if(!rows.length){ toast('Aucune donnée à exporter.', 'err'); return; }
  if(typeof XLSX !== 'undefined'){
    try{
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
      XLSX.writeFile(wb, filenameBase + '.xlsx');
      toast('Fichier Excel (.xlsx) téléchargé.');
      return;
    }catch(e){ console.error(e); }
  }
  downloadBlob(filenameBase + '.csv', toCSVString(headers, rows), 'text/csv;charset=utf-8;');
  const extraMsg = typeof XLSX==='undefined' ? ' Connectez-vous à internet une fois pour activer l\u2019export .xlsx direct.' : '';
  toast('Fichier CSV téléchargé (compatible Excel).' + extraMsg, 'warn');
}

function exportProducts(){
  const headers = ['Code','Nom','Catégorie','Fournisseur','Stock (zone)','Emplacement','Unité','Stock total','Seuil min','Prix achat','Prix gros','Prix détail','Péremption'];
  const rows = DB.products.filter(p=>p.active!==false).map(p=>{
    const cat = byId(DB.categories,p.categoryId), sup = byId(DB.suppliers,p.supplierId), stk = byId(DB.stocks,p.homeStockId), u = p.units[0];
    return [p.code||'', p.name, cat?cat.name:'', sup?sup.name:'', stk?stk.name:'', (p.location||'')+' '+(p.locationNumber||''), u?u.name:'', totalStock(p.id), p.minThresholdBase||0, p.purchasePrice||0, u?u.priceWholesale:0, u?u.priceRetail:0, p.expiryDate? fmtDateOnly(p.expiryDate):''];
  });
  exportData('TRNaja_Produits_'+todayStr(), 'Produits', headers, rows);
}
function exportSales(){
  const headers = ['N° facture','Date','Client','Caissier','Total','Payé','Statut'];
  const list = filteredSalesList();
  const rows = list.map(s=>[s.number, fmtDate(s.date), s.clientName, s.cashierName, s.total, s.paid, s.status==='valid'? (s.isCredit?'Crédit':'Validée') : 'Annulée']);
  exportData('TRNaja_Ventes_'+todayStr(), 'Ventes', headers, rows);
}
function exportCredits(){
  const headers = ['Client','Téléphone','Date','Total','Payé','Reste à payer'];
  const rows = DB.credits.map(cr=>[cr.clientName, cr.phone||'', fmtDateOnly(cr.date), cr.total, cr.paid, cr.remaining]);
  exportData('TRNaja_Credits_'+todayStr(), 'Credits', headers, rows);
}
function exportStatsBilan(){
  const [s,e] = periodRange();
  const sales = salesBetween(s,e);
  const headers = ['N° facture','Date','Client','Total','Bénéfice estimé'];
  const rows = sales.map(sale=>[sale.number, fmtDate(sale.date), sale.clientName, sale.total, Math.round(estimateProfit(sale))]);
  exportData('TRNaja_Bilan_'+STATS_PERIOD+'_'+todayStr(), 'Bilan', headers, rows);
}
function exportStatsBilanPDF(){
  const [s,e] = periodRange();
  const sales = salesBetween(s,e);
  const expenses = DB.expenses.filter(x=>x.date>=s && x.date<=e);
  const total = sumSales(sales);
  const expTotal = expenses.reduce((a,x)=>a+x.amount,0);
  const showProfit = isAdmin() || can('seeProfit');
  const profit = sales.reduce((a,x)=>a+estimateProfit(x),0);
  const summary = `<h2>Résumé</h2><table><tbody>
    <tr><td>Chiffre d'affaires</td><td>${fmtAr(total)}</td></tr>
    <tr><td>Bénéfice estimé</td><td>${showProfit?fmtAr(profit):'—'}</td></tr>
    <tr><td>Dépenses</td><td>${fmtAr(expTotal)}</td></tr>
    <tr><td>Nombre de ventes</td><td>${sales.length}</td></tr>
  </tbody></table>`;
  const rows = sales.map(sale=>[sale.number, fmtDate(sale.date), sale.clientName, fmtAr(sale.total)]);
  const detail = `<h2>Détail des ventes</h2>` + tableHtml(['N° facture','Date','Client','Total'], rows);
  printPDFDoc('Bilan — '+({day:'Jour',week:'Semaine',month:'Mois',year:'Année'}[STATS_PERIOD]||''), '', summary+detail);
}

/* =========================================================
   MAGASINS / LIEUX DE STOCK (page dédiée)
========================================================= */
function render_stores(c){
  c.innerHTML = `
    <div class="toolbar"><div class="spacer"></div><button class="btn btn-ghost" onclick="exportStoresReportPDF()">🖨️ Rapport de stock (PDF)</button><button class="btn btn-primary" onclick="openStoreModal()">+ Ajouter un magasin / stock</button></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Nom</th><th>Adresse</th><th>Produits associés</th><th>Alertes</th><th>Statut</th><th></th></tr></thead>
      <tbody>${DB.stocks.map(s=>{
        const prods = DB.products.filter(p=>p.active!==false && (p.homeStockId===s.id || ((DB.stockLevels[p.id]||{})[s.id]||0)>0));
        const lowInStore = prods.filter(p=> ((DB.stockLevels[p.id]||{})[s.id]||0) <= (p.minThresholdBase||0));
        const expInStore = prods.filter(p=> p.expiryDate && new Date(p.expiryDate) <= new Date(Date.now()+(DB.settings.expiryWarnDays||30)*86400000));
        return `<tr>
        <td><b>${escapeHtml(s.name)}</b></td>
        <td>${escapeHtml(s.address||'—')}</td>
        <td>${prods.length}</td>
        <td>${lowInStore.length? `<span class="badge badge-red">${lowInStore.length} faible</span>`:''} ${expInStore.length? `<span class="badge badge-orange">${expInStore.length} péremption</span>`:''}${(!lowInStore.length&&!expInStore.length)?'<span class="badge badge-green">OK</span>':''}</td>
        <td>${s.active!==false? '<span class="badge badge-green">✓ Actif</span>' : '<span class="badge badge-red">Inactif</span>'}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-icon btn-sm" title="Voir les produits" onclick="showStoreProducts('${s.id}')">👁️</button>
          <button class="btn btn-icon btn-sm" title="Modifier" onclick="openStoreModal('${s.id}')">✏️</button>
          <button class="btn btn-icon btn-sm" title="${s.active!==false?'Désactiver':'Activer'}" onclick="toggleStoreActive('${s.id}')">${s.active!==false?'🚫':'✅'}</button>
        </td>
      </tr>`;}).join('')}</tbody>
    </table></div></div>
  `;
}
function showStoreProducts(storeId){
  const s = byId(DB.stocks, storeId);
  const prods = DB.products.filter(p=>p.active!==false && (p.homeStockId===storeId || ((DB.stockLevels[p.id]||{})[storeId]||0)>0));
  openModal({ title: 'Produits — '+s.name, large:true, bodyHtml: `
    <div class="table-wrap"><table><thead><tr><th>Produit</th><th>Stock ici</th><th>Seuil</th><th>Péremption</th><th>État</th>${isAdmin()?'<th></th>':''}</tr></thead>
    <tbody>${prods.length? prods.map(p=>{
      const qty = (DB.stockLevels[p.id]||{})[storeId] || 0;
      const isLow = qty <= (p.minThresholdBase||0);
      let expBadge = '';
      if(p.expiryDate){
        const days = Math.ceil((new Date(p.expiryDate) - new Date())/86400000);
        if(days<0) expBadge = '<span class="badge badge-red">Périmé</span>';
        else if(days<=(DB.settings.expiryWarnDays||30)) expBadge = `<span class="badge badge-orange">${days} j</span>`;
      }
      return `<tr>
        <td>${escapeHtml(p.name)}</td>
        <td style="color:${isLow?'var(--red)':'inherit'};font-weight:${isLow?'700':'400'}">${fmtNum(qty)}</td>
        <td>${fmtNum(p.minThresholdBase||0)}</td>
        <td>${p.expiryDate? fmtDateOnly(p.expiryDate):'—'} ${expBadge}</td>
        <td>${isLow? '<span class="badge badge-orange">Stock faible</span>':'<span class="badge badge-green">OK</span>'}</td>
        ${isAdmin()? `<td><button class="btn btn-icon btn-sm" onclick="closeModal();openProductModal('${p.id}')">✏️</button></td>`:''}
      </tr>`;
    }).join('') : `<tr><td colspan="6"><div class="empty-state">Aucun produit associé à ce magasin.</div></td></tr>`}</tbody></table></div>
  `, footHtml:`<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>` });
}
function exportStoresReportPDF(){
  const rowsHtml = DB.stocks.map(s=>{
    const prods = DB.products.filter(p=>p.active!==false && (p.homeStockId===s.id || ((DB.stockLevels[p.id]||{})[s.id]||0)>0));
    const lines = prods.map(p=>{
      const qty = (DB.stockLevels[p.id]||{})[s.id] || 0;
      const isLow = qty <= (p.minThresholdBase||0);
      return `<tr><td>${escapeHtml(p.name)}</td><td>${fmtNum(qty)}</td><td>${fmtNum(p.minThresholdBase||0)}</td><td>${isLow?'Stock faible':'OK'}</td></tr>`;
    }).join('');
    return `<h2>${escapeHtml(s.name)} ${s.address?'— '+escapeHtml(s.address):''}</h2>
    <table><thead><tr><th>Produit</th><th>Stock</th><th>Seuil</th><th>État</th></tr></thead><tbody>${lines || '<tr><td colspan="4">Aucun produit.</td></tr>'}</tbody></table>`;
  }).join('');
  printPDFDoc('Rapport de stock par magasin', 'Situation au '+fmtDateOnly(nowISO()), rowsHtml);
}
function openStoreModal(id){
  const s = id? byId(DB.stocks,id):null;
  openModal({ title: s? 'Modifier le magasin / stock':'Nouveau magasin / stock', bodyHtml:`
    <div class="form-grid">
      <div class="field full"><label>Nom *</label><input id="stName" value="${s?escapeHtml(s.name):''}" placeholder="ex: Dépôt principal, Quincaillerie 2..."></div>
      <div class="field full"><label>Adresse</label><input id="stAddress" value="${s?escapeHtml(s.address||''):''}" placeholder="ex: Ampefiloha"></div>
    </div>`,
    footHtml:`<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveStore(${s?`'${s.id}'`:'null'})">Enregistrer</button>` });
}
function saveStore(id){
  const name = document.getElementById('stName').value.trim();
  if(!name){ toast('Le nom est obligatoire.', 'err'); return; }
  const address = document.getElementById('stAddress').value.trim();
  if(id){ const s = byId(DB.stocks,id); s.name=name; s.address=address; logHistory('Magasin modifié', name); }
  else { DB.stocks.push({id:uid('stk'), name, address, active:true}); logHistory('Magasin créé', name); }
  saveDB(); closeModal(); refresh(); toast('Magasin enregistré.');
}
function toggleStoreActive(id){
  const s = byId(DB.stocks,id); s.active = s.active===false ? true : false;
  logHistory(s.active?'Magasin activé':'Magasin désactivé', s.name);
  saveDB(); refresh();
}

function quickAddSupplier(){
  const name = prompt('Nom du nouveau fournisseur :');
  if(!name || !name.trim()) return;
  const sup = { id: uid('sup'), name: name.trim(), phone:'', address:'', notes:'' };
  DB.suppliers.push(sup);
  logHistory('Fournisseur créé (ajout rapide)', sup.name);
  saveDB();
  const sel = document.getElementById('pdSupplier');
  if(sel){ sel.insertAdjacentHTML('beforeend', `<option value="${sup.id}">${escapeHtml(sup.name)}</option>`); sel.value = sup.id; }
  toast('Fournisseur ajouté : ' + sup.name);
}
